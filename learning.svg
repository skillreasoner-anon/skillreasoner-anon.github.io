<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="learning-title learning-desc" id="learning-diagram" data-learning-stage="0">
  <title id="learning-title">Learning state and skill representations, then proposal, dynamics, and value</title>
  <desc id="learning-desc">Learn the state encoder and grounding through goal feature prediction. Learn the skill encoder and skill decoder by reconstructing the actions and duration of varying-horizon play windows. Freeze the representation modules E, Q, D, G, then learn proposal P, dynamics F, and value V on encoded states and skills.</desc>
  <defs>
    <marker id="learn-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#627f90"/></marker>
    <marker id="target-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#985c48"/></marker>
  </defs>
  <g class="learning-state-panel">
    <text x="24" y="32" class="learning-label">STATE AND SKILL REPRESENTATIONS</text>
    <text x="24" y="72" class="learning-subtitle">Latent state through goal feature prediction</text>
    <rect x="25" y="140" width="167" height="78" rx="4" class="learning-input"/>
    <text x="108" y="167" text-anchor="middle">History h<tspan class="math-sub">t</tspan></text><text x="108" y="194" text-anchor="middle" class="learning-caption">RGB + proprioception</text>
    <path d="M202 179H230" class="learning-flow" marker-end="url(#learn-arrow)"/>
    <rect x="244" y="149" width="153" height="60" rx="4" class="learning-module"/><text x="320" y="185" text-anchor="middle">State encoder E</text>
    <path d="M408 179H443" class="learning-flow" marker-end="url(#learn-arrow)"/>
    <circle cx="474" cy="179" r="25" class="learning-state"/><text x="474" y="185" text-anchor="middle">z<tspan class="math-sub">t</tspan></text>
    <path d="M510 179H542" class="learning-flow" marker-end="url(#learn-arrow)"/>
    <rect x="556" y="149" width="143" height="60" rx="4" class="learning-module"/><text x="627" y="185" text-anchor="middle">Grounding G</text>
    <path d="M711 179H739" class="learning-flow" marker-end="url(#learn-arrow)"/>
    <rect x="753" y="140" width="179" height="78" rx="4" class="learning-output"/><text x="842" y="170" text-anchor="middle">Goal features ŷ</text><text x="842" y="195" text-anchor="middle" class="learning-caption">Coordinatewise variance</text>
    <path d="M842 233V261" class="learning-supervision" marker-end="url(#target-arrow)"/>
    <rect x="753" y="276" width="179" height="55" rx="4" class="learning-target"/><text x="842" y="309" text-anchor="middle">Keypoint targets y</text>
    <text x="25" y="303" class="learning-caption">3-step observation–action history</text>
    <text x="25" y="332" class="learning-caption">Variance weights feature errors during training.</text>
  </g>
  <g class="learning-skill-panel">
    <text x="24" y="32" class="learning-label">STATE AND SKILL REPRESENTATIONS</text>
    <text x="24" y="72" class="learning-subtitle">Latent skills through observation-conditioned action reconstruction</text>
    <text x="25" y="115" class="learning-caption">Offline play: observations + actions</text>
    <g class="play-window-frames">
      <rect x="25" y="129" width="28" height="30"/><rect x="59" y="129" width="28" height="30"/><rect x="93" y="129" width="28" height="30"/><rect x="127" y="129" width="28" height="30"/><rect x="161" y="129" width="28" height="30"/><rect x="195" y="129" width="28" height="30"/><rect x="229" y="129" width="28" height="30"/>
    </g>
    <rect x="23" y="126" width="68" height="36" rx="2" class="sampled-window" id="sampled-window"/>
    <path d="M23 169V177H91V169" class="window-bracket" id="window-bracket"/>
    <text x="25" y="198" class="learning-caption" id="sampled-duration">Sampled window · d = 2</text>
    <path d="M142 217V242H269" class="learning-flow" marker-end="url(#learn-arrow)"/>
    <rect x="283" y="210" width="140" height="64" rx="4" class="learning-module"/><text x="353" y="248" text-anchor="middle">Skill encoder Q</text>
    <path d="M436 242H463" class="learning-flow" marker-end="url(#learn-arrow)"/>
    <g class="learning-tokens"><rect x="477" y="226" width="29" height="32"/><rect x="514" y="226" width="29" height="32"/><rect x="551" y="226" width="29" height="32"/></g>
    <text x="529" y="298" text-anchor="middle" class="learning-caption">Fixed-length skill tokens u</text>
    <path d="M593 242H623" class="learning-flow" marker-end="url(#learn-arrow)"/>
    <rect x="637" y="210" width="135" height="64" rx="4" class="learning-module"/><text x="704" y="248" text-anchor="middle">Skill decoder D</text>
    <circle cx="704" cy="122" r="24" class="learning-state"/><text x="704" y="128" text-anchor="middle">z<tspan class="math-sub">t</tspan></text><path d="M704 157V195" class="learning-flow conditioning-flow" marker-end="url(#learn-arrow)"/>
    <path d="M784 242H804" class="learning-flow" marker-end="url(#learn-arrow)"/>
    <rect x="818" y="201" width="117" height="82" rx="4" class="learning-output"/><text x="876" y="232" text-anchor="middle">Actions</text><text x="876" y="260" text-anchor="middle">Duration d</text>
    <path d="M876 297V320" class="learning-supervision" marker-end="url(#target-arrow)"/>
    <text x="876" y="347" text-anchor="middle" class="learning-caption">Window actions</text>
    <text x="876" y="372" text-anchor="middle" class="learning-caption">Duration d</text>
    <text x="25" y="364" class="learning-caption">The observations let Q encode what the actions achieved.</text>
  </g>
  <g class="learning-search-panel">
    <text x="24" y="32" class="learning-label">PROPOSAL, DYNAMICS, AND VALUE</text>
    <text x="24" y="65" class="learning-subtitle">Learn on frozen state and skill representations</text>
    <text x="25" y="112" class="learning-caption">Frozen</text>
    <g class="frozen-modules">
      <rect x="132" y="86" width="193" height="44" rx="4"/><rect x="334" y="86" width="193" height="44" rx="4"/><rect x="536" y="86" width="193" height="44" rx="4"/><rect x="738" y="86" width="193" height="44" rx="4"/>
      <text x="228" y="113" text-anchor="middle">State encoder E</text><text x="430" y="113" text-anchor="middle">Skill encoder Q</text><text x="632" y="113" text-anchor="middle">Skill decoder D</text><text x="834" y="113" text-anchor="middle">Grounding G</text>
    </g>
    <text x="25" y="160" class="learning-label">INPUTS</text><text x="296" y="160" class="learning-label">LEARNED COMPONENT</text><text x="584" y="160" class="learning-label">TRAINING TARGET</text>
    <g class="proposal-training">
      <text x="110" y="203" text-anchor="middle">State z</text>
      <path d="M218 197H280" class="learning-flow" pathLength="1" marker-end="url(#learn-arrow)"/>
      <rect x="296" y="170" width="193" height="55" rx="4" class="learning-module"/><text x="392" y="203" text-anchor="middle">Proposal P</text>
      <path d="M505 197H558" class="learning-flow" pathLength="1" marker-end="url(#learn-arrow)"/>
      <text x="584" y="203">Q-encoded skills u</text>
    </g>
    <g class="dynamics-training">
      <text x="110" y="282" text-anchor="middle">State z, skill u</text>
      <path d="M218 276H280" class="learning-flow" pathLength="1" marker-end="url(#learn-arrow)"/>
      <rect x="296" y="249" width="193" height="55" rx="4" class="learning-module"/><text x="392" y="282" text-anchor="middle">Dynamics F</text>
      <path d="M505 276H558" class="learning-flow" pathLength="1" marker-end="url(#learn-arrow)"/>
      <text x="584" y="282" aria-label="Encoded endpoints E of history h sub t plus d">Encoded endpoints E(h<tspan class="math-sub">t+d</tspan>)</text>
    </g>
    <g class="value-training">
      <text x="110" y="361" text-anchor="middle" aria-label="State z, goal z sub g">State z, goal z<tspan class="math-sub">g</tspan></text>
      <path d="M218 355H280" class="learning-flow" pathLength="1" marker-end="url(#learn-arrow)"/>
      <rect x="296" y="328" width="193" height="55" rx="4" class="learning-module"/><text x="392" y="361" text-anchor="middle">Value V</text>
      <path d="M505 355H558" class="learning-flow" pathLength="1" marker-end="url(#learn-arrow)"/>
      <text x="584" y="351">Negative goal-reaching cost</text><text x="584" y="378" class="learning-caption">Duration-aware, from hindsight goals</text>
    </g>
  </g>
</svg>
