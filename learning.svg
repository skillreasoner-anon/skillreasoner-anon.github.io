<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="learning-title learning-desc" id="learning-diagram" data-learning-stage="0">
  <title id="learning-title">Learning State and Skill Representations, then Proposal, Dynamics, and Value</title>
  <desc id="learning-desc">Learn the state encoder and grounding through goal feature prediction. Learn the skill encoder and skill decoder by reconstructing the actions and duration of varying-horizon play windows. Freeze the representation modules E, Q, D, G, then learn proposal P, dynamics F, and value V on encoded states and skills.</desc>
  <defs>
    <marker id="learn-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#79848A"/></marker>
    <marker id="target-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#A56A56"/></marker>
  </defs>
  <g class="learning-state-panel">
    <text x="24" y="32" class="learning-label">State Representation Learning</text>
    <text x="24" y="72" class="learning-subtitle">Latent State through Goal Feature Prediction</text>
    <rect x="20" y="134" width="177" height="90" rx="4" class="learning-input"/>
    <text x="108" y="167" text-anchor="middle">History <tspan class="math-symbol">h<tspan class="math-sub">t</tspan></tspan></text><text x="108" y="194" text-anchor="middle" class="learning-caption">RGB + Proprioception</text>
    <path d="M202 179H219" class="learning-flow" marker-end="url(#learn-arrow)"/>
    <rect x="230.5" y="149" width="180" height="60" rx="4" class="learning-module"/><text x="320" y="185" text-anchor="middle">State Encoder <tspan class="math-symbol">E</tspan></text>
    <path d="M422 179H443" class="learning-flow" marker-end="url(#learn-arrow)"/>
    <circle cx="474" cy="179" r="25" class="learning-state"/><text x="474" y="185" text-anchor="middle"><tspan class="math-symbol">z<tspan class="math-sub">t</tspan></tspan></text>
    <path d="M510 179H525" class="learning-flow" marker-end="url(#learn-arrow)"/>
    <rect x="537.5" y="149" width="180" height="60" rx="4" class="learning-module"/><text x="627" y="185" text-anchor="middle">Grounding <tspan class="math-symbol">G</tspan></text>
    <path d="M728 179H739" class="learning-flow" marker-end="url(#learn-arrow)"/>
    <rect x="753" y="140" width="179" height="78" rx="4" class="learning-output"/><text x="842" y="170" text-anchor="middle">Goal Features <tspan class="math-symbol">ŷ</tspan></text><text x="842" y="195" text-anchor="middle" class="learning-caption">Coordinatewise Variance</text>
    <path d="M842 233V261" class="learning-supervision" marker-end="url(#target-arrow)"/>
    <rect x="753" y="276" width="179" height="55" rx="4" class="learning-target"/><text x="842" y="309" text-anchor="middle">Keypoint Targets <tspan class="math-symbol">y</tspan></text>
    <text x="25" y="303" class="learning-caption">3-Step Observation–Action History</text>
    <text x="25" y="332" class="learning-caption">Variance weights feature errors during training.</text>
  </g>
  <g class="learning-skill-panel">
    <text x="24" y="32" class="learning-label">Skill Representation Learning</text>
    <text x="24" y="72" class="learning-subtitle">Observation-Conditioned Action Reconstruction</text>
    <text x="25" y="115" class="learning-caption">Offline Play: Observations + Actions</text>
    <g class="play-window-frames"><rect x="25" y="129" width="24" height="30"/><text x="37" y="150" text-anchor="middle">1</text><rect x="55" y="129" width="24" height="30"/><text x="67" y="150" text-anchor="middle">2</text><rect x="85" y="129" width="24" height="30"/><text x="97" y="150" text-anchor="middle">3</text><rect x="115" y="129" width="24" height="30"/><text x="127" y="150" text-anchor="middle">4</text><rect x="145" y="129" width="24" height="30"/><text x="157" y="150" text-anchor="middle">5</text><rect x="175" y="129" width="24" height="30"/><text x="187" y="150" text-anchor="middle">6</text><rect x="205" y="129" width="24" height="30"/><text x="217" y="150" text-anchor="middle">7</text><rect x="235" y="129" width="24" height="30"/><text x="247" y="150" text-anchor="middle">8</text><rect x="265" y="129" width="24" height="30"/><text x="277" y="150" text-anchor="middle">9</text><rect x="295" y="129" width="24" height="30"/><text x="307" y="150" text-anchor="middle">10</text><rect x="325" y="129" width="24" height="30"/><text x="337" y="150" text-anchor="middle">11</text><rect x="355" y="129" width="24" height="30"/><text x="367" y="150" text-anchor="middle">12</text><rect x="385" y="129" width="24" height="30"/><text x="397" y="150" text-anchor="middle">13</text><rect x="415" y="129" width="24" height="30"/><text x="427" y="150" text-anchor="middle">14</text><rect x="445" y="129" width="24" height="30"/><text x="457" y="150" text-anchor="middle">15</text><rect x="475" y="129" width="24" height="30"/><text x="487" y="150" text-anchor="middle">16</text><rect x="505" y="129" width="24" height="30"/><text x="517" y="150" text-anchor="middle">17</text><rect x="535" y="129" width="24" height="30"/><text x="547" y="150" text-anchor="middle">18</text><rect x="565" y="129" width="24" height="30"/><text x="577" y="150" text-anchor="middle">19</text><rect x="595" y="129" width="24" height="30"/><text x="607" y="150" text-anchor="middle">20</text></g>
    <rect x="83" y="125" width="60" height="38" rx="4" class="sampled-window" id="sampled-window"/>
    <path d="M83 169V177H143V169" class="window-bracket" id="window-bracket"/>
    <rect x="700" y="96" width="237" height="32" rx="4" class="window-label-bg"/>
    <text x="712" y="117" id="sampled-duration">Sampled Window · <tspan class="math-symbol">d</tspan> = 2</text>
    <path id="window-flow" d="M113 177V216H230V232" class="learning-flow" marker-end="url(#learn-arrow)"/>
    <rect x="140" y="240" width="180" height="60" rx="4" class="learning-module"/>
    <text x="230" y="276" text-anchor="middle">Skill Encoder <tspan class="math-symbol">Q</tspan></text>
    <path d="M332 270H371" class="learning-flow" marker-end="url(#learn-arrow)"/>
    <g class="learning-tokens"><rect x="386" y="254" width="29" height="32"/><rect x="426" y="254" width="29" height="32"/><rect x="466" y="254" width="29" height="32"/></g>
    <text x="441" y="333" text-anchor="middle" class="learning-caption">Discrete Tokens <tspan class="math-symbol">u</tspan></text>
    <path d="M507 270H546" class="learning-flow" marker-end="url(#learn-arrow)"/>
    <rect x="560" y="240" width="180" height="60" rx="4" class="learning-module"/>
    <text x="650" y="276" text-anchor="middle">Skill Decoder <tspan class="math-symbol">D</tspan></text>
    <circle cx="650" cy="180" r="25" class="learning-state"/><text x="650" y="186" text-anchor="middle"><tspan class="math-symbol">z<tspan class="math-sub">t</tspan></tspan></text>
    <path d="M650 211V228" class="learning-flow conditioning-flow" marker-end="url(#learn-arrow)"/>
    <path d="M752 270H770" class="learning-flow" marker-end="url(#learn-arrow)"/>
    <rect x="782" y="231" width="155" height="78" rx="4" class="learning-output"/>
    <text x="859" y="258" text-anchor="middle">Actions</text><text x="859" y="287" text-anchor="middle">Duration <tspan class="math-symbol">d</tspan></text>
    <path d="M859 319V337" class="learning-supervision" marker-end="url(#target-arrow)"/>
    <text x="859" y="360" text-anchor="middle" class="learning-caption">Window Actions</text><text x="859" y="384" text-anchor="middle" class="learning-caption">Duration <tspan class="math-symbol">d</tspan></text>
  </g>
  <g class="learning-search-panel">
    <text x="24" y="32" class="learning-label">Proposal, Dynamics, and Value</text>
    <text x="24" y="65" class="learning-subtitle">Learn on Frozen State and Skill Representations</text>
    <text x="25" y="121" class="learning-caption">Frozen</text>
    <g class="frozen-modules">
      <rect x="138.5" y="86" width="180" height="60" rx="4"/><rect x="340.5" y="86" width="180" height="60" rx="4"/><rect x="542.5" y="86" width="180" height="60" rx="4"/><rect x="744.5" y="86" width="180" height="60" rx="4"/>
      <text x="228" y="121" text-anchor="middle">State Encoder <tspan class="math-symbol">E</tspan></text><text x="430" y="121" text-anchor="middle">Skill Encoder <tspan class="math-symbol">Q</tspan></text><text x="632" y="121" text-anchor="middle">Skill Decoder <tspan class="math-symbol">D</tspan></text><text x="834" y="121" text-anchor="middle">Grounding <tspan class="math-symbol">G</tspan></text>
    </g>

    <g class="proposal-training">
      <text x="110" y="203" text-anchor="middle">State <tspan class="math-symbol">z</tspan></text>
      <path d="M218 197H280" class="learning-flow" pathLength="1" marker-end="url(#learn-arrow)"/>
      <rect x="302.5" y="167.5" width="180" height="60" rx="4" class="learning-module"/><text x="392" y="203" text-anchor="middle">Proposal <tspan class="math-symbol">P</tspan></text>
      <path d="M505 197H558" class="learning-flow" pathLength="1" marker-end="url(#learn-arrow)"/>
      <text x="584" y="203">Q-Encoded Skills <tspan class="math-symbol">u</tspan></text>
    </g>
    <g class="dynamics-training">
      <text x="110" y="282" text-anchor="middle">State <tspan class="math-symbol">z</tspan>, Skill <tspan class="math-symbol">u</tspan></text>
      <path d="M218 276H280" class="learning-flow" pathLength="1" marker-end="url(#learn-arrow)"/>
      <rect x="302.5" y="246.5" width="180" height="60" rx="4" class="learning-module"/><text x="392" y="282" text-anchor="middle">Dynamics <tspan class="math-symbol">F</tspan></text>
      <path d="M505 276H558" class="learning-flow" pathLength="1" marker-end="url(#learn-arrow)"/>
      <text x="584" y="282" aria-label="Encoded endpoints E of history h sub t plus d">Encoded Endpoints <tspan class="math-symbol">E</tspan>(<tspan class="math-symbol">h<tspan class="math-sub">t+d</tspan></tspan>)</text>
    </g>
    <g class="value-training">
      <text x="110" y="361" text-anchor="middle" aria-label="State z, goal z sub g">State <tspan class="math-symbol">z</tspan>, Goal <tspan class="math-symbol">z<tspan class="math-sub">g</tspan></tspan></text>
      <path d="M218 355H280" class="learning-flow" pathLength="1" marker-end="url(#learn-arrow)"/>
      <rect x="302.5" y="325.5" width="180" height="60" rx="4" class="learning-module"/><text x="392" y="361" text-anchor="middle">Value <tspan class="math-symbol">V</tspan></text>
      <path d="M505 355H558" class="learning-flow" pathLength="1" marker-end="url(#learn-arrow)"/>
      <text x="584" y="351">Negative Goal-Reaching Cost</text>
    </g>
  </g>
</svg>
